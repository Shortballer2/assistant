<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Assistant</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>My Assistant</h1>
      <p class="subtitle">Autonomous mode runs even when you are not actively chatting.</p>

      <section class="card">
        <h2>Autopilot</h2>
        <div class="row">
          <input id="interval" type="number" min="30" value="300" />
          <button id="start">Start</button>
          <button id="stop" class="secondary">Stop</button>
        </div>
        <pre id="status" class="panel">Loading...</pre>
      </section>

      <section class="card">
        <h2>Latest Brief</h2>
        <pre id="brief" class="panel">No brief generated yet.</pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
